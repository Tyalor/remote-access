[package]
name = "ra-client"
description = "Connect to a host by ID: resolves via rendezvous, pairs with a password, and launches Moonlight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
ra-proto = { path = "../ra-proto" }
ra-gamestream = { path = "../ra-gamestream" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
rpassword = "7"
hostname = "0.4"
futures = "0.3"
