[workspace]
resolver = "2"
members = [
    "crates/ra-proto",
    "crates/ra-gamestream",
    "crates/ra-rendezvous",
    "crates/ra-host",
    "crates/ra-client",
    "crates/ra-fakehost",
    "crates/ra-desk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Tyalor/remote-access"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
hex = "0.4"
rcgen = "0.13"
x509-parser = "0.16"
rsa = { version = "0.9", features = ["sha2"] }
directories = "5"
toml = "0.8"

# RSA-2048 keygen is unusably slow unoptimized; keep the math crates fast in dev/test.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
