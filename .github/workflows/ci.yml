name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # Upstream submodules are large and not needed to build the Rust glue.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: end-to-end (rendezvous + fake Apollo + host agent + client)
        if: runner.os != 'Windows'
        run: ./scripts/e2e.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ra-rendezvous .
      - name: smoke
        run: |
          docker run -d --name rv -p 21114:21114 ra-rendezvous
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:21114/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:21114/v1/health
